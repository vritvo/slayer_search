[project]
name = "buffy-search"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bs4",
    "requests",
    "toml",
    "rapidfuzz",
    "numpy",
    "openai",
    "dotenv",
    "pandas",
    "sqlite-vss",
    "sentence_transformers",
    "flask",
    "torch",
    "einops",
    "langextract",
    "anthropic",
    "gunicorn>=23.0.0",
]

# The server has no GPU, so install the CPU-only torch build on Linux (~200 MB
# instead of ~7 GB of CUDA libraries). macOS keeps the default PyPI build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# Local-only tools (notebooks, tests, plotting). Not installed in the Docker image.
[dependency-groups]
dev = [
    "jupyterlab",
    "notebook",
    "ipykernel",
    "pytest>=9.0.2",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
]
